[workspace]
resolver = "3"
members = ["crates/engine-core", "crates/engine-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
log = "0.4"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

# Development profile: fast iteration, debug assertions on.
[profile.dev]
opt-level = 1

# Release profile: what the shipped game uses. No test code, no debug overlay.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1
