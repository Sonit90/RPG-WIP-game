[package]
name = "engine-assetgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The procedural starter-content generator's command line. A crate of its own, for the reason
# `engine-assetcheck` is one: nothing a content tool needs — a directory writer, an argument
# parser, a summary formatter — can end up linked into the game. `cargo build --bin mygame`
# does not build this at all.
[dependencies]
# The starter library, the glTF writer and the material file. Every asset this produces is
# built by that crate; this one chooses where the files go and reports what it wrote.
engine-assets = { workspace = true }
# The engine's logger, so a run's log lines look like every other log line in the project.
engine-core = { workspace = true }
log = { workspace = true }

[[bin]]
name = "asset_gen"
path = "src/main.rs"

[lints]
workspace = true
