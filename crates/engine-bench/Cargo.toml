[package]
name = "engine-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A separate crate with its own binary, so nothing here can end up in the game
# executable. `cargo build --release --bin mygame` does not build this at all.
[[bin]]
name = "performance_test"
path = "src/main.rs"

# CPU-side benchmarks (allocators, job system, input, profiler). Separate from the
# renderer benchmark because it needs no GPU and runs in seconds, so it can be used as a
# quick regression check.
[[bin]]
name = "cpu_bench"
path = "src/cpu_bench.rs"

# Frustum culling on its own: no device, no draws. Separate because "is culling fast
# enough?" is a question about a CPU pass over an array, and measuring it inside a frame
# that also records thousands of draw calls measures the draw calls.
[[bin]]
name = "cull_bench"
path = "src/cull_bench.rs"

# Gameplay on its own: simulation, combat, extraction and culling with no device. The
# question "is gameplay fast enough?" is about a CPU pass over arrays, and measuring it
# inside a frame that also records draw calls measures the draw calls.
[[bin]]
name = "game_bench"
path = "src/game_bench.rs"

# The user interface on its own: layout, batching and drawing. Separate from the gameplay
# benchmark because "is the UI fast enough?" is a question about a different pass, and the
# Phase 3 audit showed it is the one that moves the frame's tail.
[[bin]]
name = "ui_bench"
path = "src/ui_bench.rs"

# Collision on its own: the broad phase, the narrow phase and the character controller,
# with no simulation and no device around them. Separate from game_bench because "is
# collision fast enough?" is a question about a different pass over different arrays.
[[bin]]
name = "collision_bench"
path = "src/collision_bench.rs"

# The environment on its own: placement, level-of-detail selection, culling and batching,
# plus the draw-call and triangle counts the environment submits. Separate from game_bench
# because "what does the level cost?" and "what does the fight cost?" are different
# questions, and the scenarios that answer the first hold the fight constant.
[[bin]]
name = "env_bench"
path = "src/env_bench.rs"

# Combat's effects on their own: event observation, the VFX update, and what the effects add
# to extraction, culling and batching. Separate from game_bench because "what does the fight
# cost?" and "what do its effects cost?" are different questions, and the scenarios that
# answer the second run the first one twice — once with effects and once without.
# Combat's audio on its own: event observation, the director's update, and the mix itself,
# with no device. Separate from vfx_bench because the two answer different questions and the
# audio one is the only benchmark in the workspace that measures a second thread's work.
[[bin]]
name = "audio_bench"
path = "src/audio_bench.rs"

[[bin]]
name = "vfx_bench"
path = "src/vfx_bench.rs"

[dependencies]
engine-collision = { workspace = true }
engine-assets = { workspace = true }
engine-core = { workspace = true }
engine-environment = { workspace = true }
engine-game = { workspace = true }
engine-presentation = { workspace = true }
# Only to open the hidden window the GPU phase renders into. No message pump beyond
# creation, and the CPU phase needs none of it.
engine-platform = { workspace = true }
engine-render-data = { workspace = true }
engine-vfx = { workspace = true }
# The audio runtime the benchmark mixes with. No device: the benchmark asks for the block a
# device would have asked for, which is what makes the mix measurable on a machine with no
# speakers and inside CI.
engine-audio = { workspace = true }
engine-renderer = { workspace = true, default-features = false }
# Only for the descriptor-heap type constants the benchmark passes through to the
# renderer's API. No D3D12 calls are made here.
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12"] }
log = { workspace = true }

[lints]
workspace = true
