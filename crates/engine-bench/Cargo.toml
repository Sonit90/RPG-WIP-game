[package]
name = "engine-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A separate crate with its own binary, so nothing here can end up in the game
# executable. `cargo build --release --bin mygame` does not build this at all.
[[bin]]
name = "performance_test"
path = "src/main.rs"

# CPU-side benchmarks (allocators, job system, input, profiler). Separate from the
# renderer benchmark because it needs no GPU and runs in seconds, so it can be used as a
# quick regression check.
[[bin]]
name = "cpu_bench"
path = "src/cpu_bench.rs"

[dependencies]
engine-core = { workspace = true }
engine-renderer = { workspace = true, default-features = false }
# Only for the descriptor-heap type constants the benchmark passes through to the
# renderer's API. No D3D12 calls are made here.
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12"] }
log = { workspace = true }

[lints]
workspace = true
