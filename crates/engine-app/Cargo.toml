[package]
name = "engine-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mygame"
path = "src/main.rs"

[features]
default = ["debug-overlay"]
# Forwards to engine-renderer. A shipping build uses --no-default-features.
debug-overlay = ["engine-renderer/debug-overlay"]
# The in-game level editor, on F6. Off by default: a player's build must not carry the
# palette, the fly camera or the scene writer, and `dep:` means the crate is not even
# compiled without this. Development builds enable it with `--features editor`.
editor = ["dep:engine-editor"]

[dependencies]
engine-assets = { workspace = true }
# The level as data: which arena to load, and what is in it.
engine-environment = { workspace = true }
engine-core = { workspace = true }
engine-platform = { workspace = true }
engine-render-data = { workspace = true }
engine-renderer = { workspace = true }
# The gameplay simulation and the layer that turns it into rendering data. This binary is
# the only place all three meet; neither of them links D3D12.
engine-game = { workspace = true }
engine-presentation = { workspace = true }
# Development only; see the `editor` feature above.
engine-editor = { workspace = true, optional = true }
# The effect catalogue, so the VFX test bed can name an effect to play. The director that
# plays them in ordinary combat lives in engine-presentation and needs nothing from here.
engine-vfx = { workspace = true }
# The sound catalogue, so the audio test bed can name a sound to play, and the runtime the
# device callback mixes. The director that plays them in ordinary combat lives in
# engine-presentation and needs nothing from here.
engine-audio = { workspace = true }
# The audio backend, and the only crate in the workspace that talks to sound hardware. It is
# a device wrapper, not an engine: the mixing is ours, in engine-audio, where it is testable
# without a machine having speakers. See phase_audio.md, Milestone 2.
cpal = "0.18"
# The player's settings and the file they live in.
engine-settings = { workspace = true }
# `release_max_level_info` compiles trace! and debug! out of release builds entirely:
# no branch, no argument evaluation, nothing left in the binary. The feature is enabled
# here, in the binary crate, because it is a process-wide decision — a library enabling it
# would silently mute its consumers' verbose logging too.
log = { workspace = true, features = ["release_max_level_info"] }

[lints]
workspace = true
