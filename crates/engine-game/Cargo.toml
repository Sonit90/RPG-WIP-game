[package]
name = "engine-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately only engine-core and engine-collision. This crate must never gain
# `windows`, `engine-platform`, `engine-renderer` or even `engine-render-data`: the
# simulation does not know that rendering exists, and the absence of those dependencies is
# what makes the seam real. It is checkable with `cargo tree -p engine-game`.
#
# engine-collision is allowed because it is the same kind of thing: simulation-side
# geometry that itself depends on engine-core alone.
#
# engine-environment is allowed for the same reason again: it is level *data* — placements,
# primitives and spawn points — and it depends on engine-core alone. It carries no mesh, no
# material and no handle, so gameplay still cannot name a thing that is drawn.
[dependencies]
engine-collision = { workspace = true }
engine-core = { workspace = true }
engine-environment = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
