[package]
name = "engine-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
engine-core.workspace = true
# The environment asset *names*, so `procedural::environment` resolves the same ids a scene
# places rather than a second list of strings that can drift from it. An id is a name, not a
# device: this does not make the crate depend on gameplay, a renderer or a collision world,
# and `engine-environment` itself depends on `engine-core` alone.
engine-environment.workspace = true
log.workspace = true
# glTF is the artist-facing interchange format. Parsed into the runtime model
# representation at load, never touched by a frame. Default features are off because the
# `import` feature drags in an image decoder and a filesystem walker for a job this crate
# does itself.
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
# The two containers glTF allows an embedded image to be in. See `texture.rs` for why the
# runtime format is uncompressed RGBA and a container is only ever a delivery mechanism.
png = "0.17"
# JPEG, which is what a DCC tool writes for a base colour map it has no alpha for. Decoder
# only, pure Rust, no encoder and no other formats dragged along.
zune-jpeg = "0.4"

[lints]
workspace = true
