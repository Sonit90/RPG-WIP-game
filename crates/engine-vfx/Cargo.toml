[package]
name = "engine-vfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Effects as data, and the runtime that plays them. Deliberately only engine-core and
# engine-render-data: no `windows`, no engine-renderer, no engine-game, no engine-assets.
#
# The absence is the point. Without a device the whole VFX runtime — spawning, ageing,
# emitting, pooling, expiring, and the particle simulation itself — is unit testable, and
# without engine-game it is impossible for an effect to reach into the simulation that
# announced it. `engine-render-data` is here for one type, `ParticleDrawList`, which is the
# frame's particles as plain data; writing into it directly is what saves a copy of every
# particle every frame.
[dependencies]
engine-core = { workspace = true }
engine-render-data = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
