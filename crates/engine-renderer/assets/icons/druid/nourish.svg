	<path fill="rgb(226,234,255)" fill-opacity="0.6" d="M 338 250 C 348 268 356 282 356 294 C 356 306 348 314 338 314 C 328 314 320 306 320 294 C 320 282 328 268 338 250 z"></path>
	<path fill="rgb(226,234,255)" fill-opacity="0.8" d="M 338 330 C 352 356 364 376 364 392 C 364 408 352 420 338 420 C 324 420 312 408 312 392 C 312 376 324 356 338 330 z"></path>
	<path fill="rgb(255,255,255)" d="M 338 436 C 356 470 372 496 372 516 C 372 538 356 552 338 552 C 320 552 304 538 304 516 C 304 496 320 470 338 436 z"></path>
	<path fill="rgb(146,164,232)" fill-opacity="0.7" d="M 348 480 C 358 500 362 512 358 524 C 350 528 342 522 340 512 C 338 500 344 490 348 480 z"></path>
