	<path fill="url(#nourish_leaf)" fill-opacity="0.25" d="M 148 528 C 148 668 234 774 338 774 C 442 774 528 668 528 528 z"></path>
	<path fill="url(#nourish_leaf)" d="M 176 552 C 176 674 250 762 338 762 C 426 762 500 674 500 552 z"></path>
	<path fill="url(#nourish_deep)" d="M 208 574 C 214 672 268 736 338 736 C 408 736 462 672 468 574 z"></path>

