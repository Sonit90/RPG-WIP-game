<svg version="1.1" xmlns="http://www.w3.org/2000/svg" style="display: block;" viewBox="0 189.333 682.667 762.667" width="682.667" height="762.667" preserveAspectRatio="none">
<defs>
	<linearGradient id="nourish_panel" gradientUnits="userSpaceOnUse" x1="23.848" y1="789.072" x2="653.072" y2="323.171">
		<stop offset="0" stop-opacity="1" stop-color="rgb(24,28,35)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(11,13,17)"></stop>
	</linearGradient>
	<radialGradient id="nourish_grove" gradientUnits="userSpaceOnUse" cx="338" cy="560" r="340">
		<stop offset="0" stop-opacity="0.42" stop-color="rgb(130,200,160)"></stop>
		<stop offset="0.55" stop-opacity="0.14" stop-color="rgb(46,66,58)"></stop>
		<stop offset="1" stop-opacity="0" stop-color="rgb(11,13,17)"></stop>
	</radialGradient>
	<linearGradient id="nourish_leaf" gradientUnits="userSpaceOnUse" x1="170" y1="300" x2="500" y2="840">
		<stop offset="0" stop-opacity="1" stop-color="rgb(186,236,152)"></stop>
		<stop offset="0.45" stop-opacity="1" stop-color="rgb(96,180,96)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(30,84,52)"></stop>
	</linearGradient>
	<linearGradient id="nourish_deep" gradientUnits="userSpaceOnUse" x1="200" y1="340" x2="470" y2="830">
		<stop offset="0" stop-opacity="1" stop-color="rgb(52,102,74)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(20,40,32)"></stop>
	</linearGradient>
	<linearGradient id="nourish_bark" gradientUnits="userSpaceOnUse" x1="240" y1="380" x2="440" y2="860">
		<stop offset="0" stop-opacity="1" stop-color="rgb(146,114,78)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(60,44,32)"></stop>
	</linearGradient>
	<linearGradient id="nourish_moon" gradientUnits="userSpaceOnUse" x1="150" y1="330" x2="520" y2="830">
		<stop offset="0" stop-opacity="1" stop-color="rgb(226,234,255)"></stop>
		<stop offset="0.5" stop-opacity="1" stop-color="rgb(146,164,232)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(64,76,132)"></stop>
	</linearGradient>
	<linearGradient id="nourish_astral" gradientUnits="userSpaceOnUse" x1="180" y1="320" x2="500" y2="840">
		<stop offset="0" stop-opacity="1" stop-color="rgb(226,196,255)"></stop>
		<stop offset="0.5" stop-opacity="1" stop-color="rgb(158,104,230)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(72,40,122)"></stop>
	</linearGradient>
	<linearGradient id="nourish_sun" gradientUnits="userSpaceOnUse" x1="150" y1="330" x2="520" y2="830">
		<stop offset="0" stop-opacity="1" stop-color="rgb(255,236,168)"></stop>
		<stop offset="0.5" stop-opacity="1" stop-color="rgb(240,182,62)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(148,90,22)"></stop>
	</linearGradient>
	<linearGradient id="nourish_bloom" gradientUnits="userSpaceOnUse" x1="200" y1="340" x2="470" y2="830">
