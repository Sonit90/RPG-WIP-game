	</radialGradient>
	<radialGradient id="detonate_core" gradientUnits="userSpaceOnUse" cx="338" cy="570" r="150">
		<stop offset="0" stop-opacity="1" stop-color="rgb(255,246,208)"></stop>
		<stop offset="0.35" stop-opacity="1" stop-color="rgb(254,224,61)"></stop>
