		<stop offset="0.82" stop-opacity="0.85" stop-color="rgb(249,134,8)"></stop>
		<stop offset="1" stop-opacity="0" stop-color="rgb(171,20,2)"></stop>
	</radialGradient>
	<linearGradient id="detonate_shard" gradientUnits="userSpaceOnUse" x1="338" y1="570" x2="338" y2="270">
