	<!-- Head: one blade of flame, drawn to a point. -->
	<path fill="url(#flame_lance_tip_glow)" d="M 17.7 230 L 659.4 230 L 659.4 911 L 17.7 911 Z"></path>
	<path fill="url(#flame_lance_blade)" d="M 438.4 390.5 C 470 350 540 320 600 255 C 585 340 540 400 501.6 439.5 C 486 425 460 405 438.4 390.5 z"></path>
	<path fill="url(#flame_lance_blade_core)" d="M 461 396 C 489 363 540 337 583 288 C 571 349 536 393 500 425 C 489 415 473 404 461 396 z"></path>
	<path fill="rgb(254,224,61)" fill-opacity="0.95" d="M 481 400 C 505 373 542 351 573 314 C 562 359 536 391 507 416 C 499 410 489 404 481 400 z"></path>

