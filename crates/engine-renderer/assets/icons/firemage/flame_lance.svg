	<path fill="url(#flame_lance_trail)" d="M 371 552 C 349 573 328 593 317 621 C 309 640 308 661 315 681 C 319 660 328 642 342 627 C 335 651 337 674 351 694 C 347 668 356 645 372 626 C 386 609 400 592 405 570 z"></path>
	<path fill="url(#flame_lance_trail)" d="M 470 430 C 452 449 435 467 427 490 C 421 507 421 525 428 542 C 431 524 439 508 451 495 C 445 516 447 536 459 553 C 456 531 463 511 477 494 C 489 480 500 465 504 447 z"></path>
	<path fill="rgb(249,124,3)" fill-opacity="0.9" d="M 331 600 C 315 617 302 635 297 656 C 306 641 317 629 331 620 C 325 636 324 651 329 666 C 331 647 340 631 354 618 C 364 608 371 596 372 583 z"></path>
	<path fill="rgb(249,124,3)" fill-opacity="0.9" d="M 226 731 C 210 749 198 767 193 788 C 202 773 213 761 227 752 C 221 768 220 783 225 798 C 227 779 236 763 250 750 C 260 740 266 728 268 715 z"></path>

