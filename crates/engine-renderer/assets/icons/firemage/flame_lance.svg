	<path fill="rgb(254,224,61)" d="M 626 300 C 632 303 636 309 636 316 C 630 313 625 308 623 302 z"></path>
	<path fill="rgb(252,191,12)" d="M 556 236 C 561 240 563 246 562 252 C 557 249 554 244 553 238 z"></path>
	<path fill="rgb(253,120,2)" d="M 213 869 C 218 873 221 879 220 885 C 215 882 211 877 210 871 z"></path>
</g>
