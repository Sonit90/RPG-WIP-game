		<stop offset="0.5" stop-opacity="1" stop-color="rgb(225,57,2)"></stop>
		<stop offset="1" stop-opacity="1" stop-color="rgb(171,20,2)"></stop>
	</linearGradient>
	<linearGradient id="flame_shield_flame" gradientUnits="userSpaceOnUse" x1="338" y1="760" x2="338" y2="380">
