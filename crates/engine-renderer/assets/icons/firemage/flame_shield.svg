	<!-- Rivets: the shield is a made thing, held together. -->
	<path fill="rgb(241,87,3)" fill-opacity="0.8" d="M 196 404 C 206 404 214 412 214 422 C 214 432 206 440 196 440 C 186 440 178 432 178 422 C 178 412 186 404 196 404 z"></path>
	<path fill="rgb(241,87,3)" fill-opacity="0.8" d="M 480 404 C 490 404 498 412 498 422 C 498 432 490 440 480 440 C 470 440 462 432 462 422 C 462 412 470 404 480 404 z"></path>
