	<path fill="rgb(254,224,61)" d="M 110 320 C 118 324 122 332 120 342 C 110 336 104 328 104 320 z"></path>
	<path fill="rgb(253,120,2)" d="M 500 752 C 508 756 512 764 510 772 C 502 768 496 760 496 752 z"></path>
</g>
